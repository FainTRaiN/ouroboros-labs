<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="우로보로스">
<title>우로보로스 랩스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbit&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 왼쪽 '뱀 고리' 코어(클릭 + 자원) · 가운데 탭 작업대(기술 트리·문명 현황) · 오른쪽 뉴스 피드. 한 가지 어두운 세계로 고정. */
:root {
  --ink: #0b0d18;
  --panel: #12152a;
  --panel-2: #1a1e38;
  --line: #2a3054;
  --text: #ebe6d8;
  --muted: #9b9cb8;
  --gold: #e4b65c;      /* 자금 · 브랜드 */
  --gold-dim: #6e5a33;
  --teal: #62c6ba;      /* 연구 */
  --violet: #a48dff;    /* 우주 · 사고 */
  --rose: #e47c6c;      /* 경고 */
  --good: #8fd18a;
  --f-display: "Orbit", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --r: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font: 14px/1.55 var(--f-body); margin: 0; overflow-x: hidden; }
button { font: inherit; color: inherit; touch-action: manipulation; }
[data-hold] { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#dock { display: none; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

.app { position: relative; z-index: 1; display: grid; grid-template-columns: 300px minmax(0, 1fr) 290px; gap: 16px;
  max-width: 1500px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; align-items: start; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding-block: 4px 2px; }
.brand { font-family: var(--f-display); font-size: 22px; letter-spacing: 0.06em; color: var(--gold); }
.chapter { font-size: 12px; letter-spacing: 0.08em; color: var(--muted); border: 1px solid var(--line); padding: 3px 10px; border-radius: 99px; }
.era { font-size: 12px; color: var(--text); }
.era b { font-family: var(--f-mono); font-weight: 500; color: var(--gold); margin-right: 6px; }
.top .spacer { flex: 1; }
.top .clock { color: var(--muted); font-size: 12px; }
.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
.ghost:hover { color: var(--text); border-color: var(--muted); }

/* ── 코어 ── */
.core { position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 14px; }
.ring-wrap { position: relative; width: 100%; max-width: 280px; aspect-ratio: 1; margin: 0 auto; }
#ring { width: 100%; height: 100%; display: block; }
#ringBtn { position: absolute; inset: 22%; border-radius: 50%; border: 0; background: radial-gradient(circle at 50% 40%, rgba(228,182,92,0.10), rgba(11,13,24,0) 70%);
  cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; -webkit-tap-highlight-color: transparent; }
#ringBtn:active { transform: scale(0.97); }
.rb-verb { font-family: var(--f-display); font-size: 17px; letter-spacing: 0.05em; }
.rb-val { font-size: 12px; color: var(--gold); text-align: center; padding-inline: 8px; }
.floater { position: fixed; z-index: 50; pointer-events: none; font: 600 13px var(--f-mono); color: var(--gold); animation: floatUp 0.9s ease-out forwards; }
@keyframes floatUp { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -46px); } }

.res { display: grid; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.res-row { display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: 10px; padding-block: 5px; }
.res-row + .res-row { border-top: 1px solid rgba(42,48,84,0.6); }
.res-label { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.res-val { text-align: right; font-size: 17px; }
.res-rate { grid-column: 1 / -1; text-align: right; font-size: 11px; color: var(--muted); margin-top: -4px; }
.c-gold { color: var(--gold); } .c-teal { color: var(--teal); } .c-violet { color: var(--violet); } .c-rose { color: var(--rose); } .c-good { color: var(--good); } .c-muted { color: var(--muted); }

.model { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; }
.model-top { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 8px; flex-wrap: wrap; }
.model-name { font-family: var(--f-display); font-size: 18px; color: var(--teal); }
.model-tier { font-size: 12px; color: var(--muted); }
.model-desc { font-size: 12.5px; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--teal); transition: width 0.25s; }
.bar.gold > i { background: var(--gold); } .bar.violet > i { background: var(--violet); } .bar.rose > i { background: var(--rose); }

.btn { border: 1px solid var(--gold-dim); background: rgba(228,182,92,0.08); color: var(--text); border-radius: 8px; padding: 8px 12px; cursor: pointer; text-align: left; transition: background 0.15s, border-color 0.15s; }
.btn:hover:not(:disabled) { background: rgba(228,182,92,0.16); border-color: var(--gold); }
.btn:disabled { opacity: 0.42; cursor: not-allowed; }
.btn.teal { border-color: #2f6b64; background: rgba(98,198,186,0.08); } .btn.teal:hover:not(:disabled) { background: rgba(98,198,186,0.16); border-color: var(--teal); }
.btn.violet { border-color: #4f4590; background: rgba(164,141,255,0.08); } .btn.violet:hover:not(:disabled) { background: rgba(164,141,255,0.16); border-color: var(--violet); }
.btn.wide { width: 100%; display: flex; justify-content: space-between; gap: 10px; align-items: center; }

/* ── 작업대 ── */
.main { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 14px; color: var(--muted); cursor: pointer; white-space: nowrap; font-size: 14px; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--gold); }
.tab .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); margin-left: 6px; vertical-align: middle; }
.panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 6px 0 -4px; }
.sec-h h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 15px; letter-spacing: 0.06em; }
.sec-h .sub { font-size: 12px; color: var(--muted); }
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.modes button { background: none; border: 0; padding: 4px 11px; font-size: 12px; color: var(--muted); cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); }

.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 14px; }
.row + .row { border-top: 1px solid rgba(42,48,84,0.7); }
.row-title { font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.row-title .cnt { font-family: var(--f-mono); font-weight: 400; font-size: 13px; color: var(--muted); }
.row-desc { font-size: 12.5px; color: var(--muted); }
.row-meta { font-size: 12px; margin-top: 2px; color: var(--muted); }
.row.locked { opacity: 0.5; }
.buy { min-width: 128px; display: flex; flex-direction: column; align-items: flex-end; gap: 0; }
.buy .n { font-size: 11px; color: var(--muted); }
.buy .c { font-family: var(--f-mono); font-size: 13px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h4 { margin: 0; font-size: 14px; font-weight: 600; }
.card p { margin: 0; font-size: 12.5px; color: var(--muted); flex: 1; }
.card .btn { text-align: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; border: 1px solid var(--line); color: var(--muted); padding: 2px 9px; border-radius: 99px; }
.chip.fx { color: var(--text); border-color: #3a416b; background: var(--panel-2); }
.chip.ok { color: var(--good); border-color: #3c5b3a; }
.chip.no { color: var(--rose); border-color: #6a3a35; }
.empty { color: var(--muted); font-size: 13px; padding: 14px; border: 1px dashed var(--line); border-radius: var(--r); }

/* 결정 이벤트 */
.event { border: 1px solid #7a4a40; background: linear-gradient(180deg, rgba(228,124,108,0.10), rgba(228,124,108,0.02)); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; animation: toastIn 0.3s ease; }
.event .kicker { font-size: 11px; letter-spacing: 0.12em; color: var(--rose); }
.event h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 18px; }
.event p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 70ch; }
.event .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
.event .opts .btn { display: grid; gap: 2px; }
.event .opts .btn small { color: var(--muted); font-size: 12px; }

/* 기술 트리 */
.tree-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.tree-inner { position: relative; }
.tree-band { position: relative; border-top: 1px solid rgba(42,48,84,0.55); }
.tree-band:first-child { border-top: 0; }
.tree-band .lab { position: sticky; left: 0; z-index: 3; width: 92px; height: 100%; display: flex; align-items: center; padding-left: 12px; font-size: 12px; color: var(--muted);
  background: linear-gradient(90deg, var(--panel) 78%, rgba(18,21,42,0)); }
.tree-svg { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; }
.node { position: absolute; z-index: 2; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); padding: 6px 9px; text-align: left; cursor: pointer;
  display: flex; flex-direction: column; justify-content: space-between; gap: 2px; overflow: hidden; }
.node .nm { font-size: 12.5px; font-weight: 600; line-height: 1.25; }
.node .ct { font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.node.done { border-color: var(--gold-dim); background: rgba(228,182,92,0.12); }
.node.done .ct { color: var(--gold); }
.node.ready { border-color: var(--teal); box-shadow: inset 0 0 0 1px var(--teal); }
.node.locked { opacity: 0.42; }
.node.sel { outline: 2px solid var(--text); outline-offset: 2px; }
.node:hover { border-color: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--line); background: var(--panel-2); }
.legend .l-done { background: rgba(228,182,92,0.35); border-color: var(--gold-dim); }
.legend .l-ready { border-color: var(--teal); box-shadow: inset 0 0 0 1px var(--teal); }
.legend .l-lock { opacity: 0.42; }
.detail { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.detail .meta { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.detail h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.detail p { margin: 0; max-width: 70ch; }
.detail .ref { font-size: 12px; color: var(--muted); font-style: italic; }
.detail .foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* 문명 현황 */
.ladder { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.rung { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); display: grid; gap: 4px; align-content: start; min-width: 0; }
.rung .k { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.rung .n { font-size: 13px; font-weight: 600; line-height: 1.3; }
.rung.past { border-color: var(--gold-dim); background: rgba(228,182,92,0.07); }
.rung.now { border-color: var(--gold); background: rgba(228,182,92,0.14); box-shadow: inset 0 0 0 1px var(--gold); }
.rung.now .k { color: var(--gold); }
.stage-now { display: grid; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.stage-now h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 20px; color: var(--gold); }
.stage-now p { margin: 0; color: var(--muted); max-width: 70ch; }
.stage-now .ref { font-size: 12px; font-style: italic; }
.vitals { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.vital { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 2px; }
.vital .k { font-size: 12px; color: var(--muted); }
.vital .v { font-family: var(--f-display); font-size: 21px; line-height: 1.3; }
.vital .d { font-size: 11.5px; color: var(--muted); }
.needs { display: grid; gap: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.need { display: grid; grid-template-columns: 76px minmax(0, 1fr) 84px; gap: 4px 12px; align-items: center; padding: 9px 14px; }
.need + .need { border-top: 1px solid rgba(42,48,84,0.6); }
.need .nm { font-weight: 600; font-size: 13px; }
.need .pct { text-align: right; font-family: var(--f-mono); font-size: 13px; }
.need .hint { grid-column: 2 / -1; font-size: 11.5px; color: var(--muted); }
.need .bar { height: 8px; }
.need .bar > i { background: linear-gradient(90deg, var(--good), var(--gold) 60%, var(--rose)); }

.sector { display: grid; gap: 6px; }
.sector .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sector .pct { font-family: var(--f-mono); font-size: 13px; }
.sector .tag { font-size: 11px; color: var(--teal); }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.metric { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; }
.metric .k { font-size: 12px; color: var(--muted); }
.metric .v { font-family: var(--f-display); font-size: 24px; }
.metric .note { font-size: 12px; color: var(--muted); }
.trust-track { position: relative; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--rose), #c9a85a 45%, var(--good)); opacity: 0.85; }
.trust-track .pin { position: absolute; top: -4px; width: 3px; height: 16px; background: var(--text); border-radius: 2px; transform: translateX(-50%); }
.trust-track .ghostpin { position: absolute; top: -2px; width: 0; height: 12px; border-left: 2px dashed var(--text); opacity: 0.6; transform: translateX(-50%); }

.gate { border: 1px solid var(--gold-dim); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; background: linear-gradient(180deg, rgba(228,182,92,0.06), rgba(228,182,92,0)); }
.gate h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 18px; color: var(--gold); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.checks li::before { content: "○ "; color: var(--muted); }
.checks li.ok::before { content: "● "; color: var(--good); }
.gate .big { font-family: var(--f-display); font-size: 16px; padding: 12px; text-align: center; }

.starmap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.scale { position: relative; height: 34px; }
.scale .track { position: absolute; left: 0; right: 0; top: 12px; height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.scale .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--violet)); }
.scale .capfill { position: absolute; top: 0; bottom: 0; left: 0; background: rgba(164,141,255,0.16); }
.scale .tick { position: absolute; top: 6px; width: 1px; height: 20px; background: var(--muted); opacity: 0.6; }
.scale-labels { position: relative; height: 30px; font-size: 11px; color: var(--muted); }
.scale-labels span { position: absolute; transform: translateX(-50%); white-space: nowrap; text-align: center; line-height: 1.3; }
.scale-labels span.first { transform: none; } .scale-labels span.last { transform: translateX(-100%); text-align: right; }

/* ── 피드 ── */
.feed { position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; max-height: calc(100vh - 40px); display: flex; flex-direction: column; min-width: 0; }
.feed h3 { margin: 0 0 8px; font-family: var(--f-display); font-weight: 400; font-size: 14px; letter-spacing: 0.08em; color: var(--muted); }
#log { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: grid; gap: 9px; font-size: 13px; }
#log li { display: grid; grid-template-columns: 44px 1fr; gap: 6px; }
#log time { font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding-top: 2px; }
#log li.k-chapter span, #log li.k-stage span { color: var(--gold); font-weight: 600; }
#log li.k-model span { color: var(--teal); }
#log li.k-space span { color: var(--violet); }
#log li.k-warn span, #log li.k-decision span { color: var(--rose); }
#log li.k-milestone span, #log li.k-upgrade span { color: var(--muted); }

/* ── 오버레이 · 토스트 ── */
#overlay { position: fixed; inset: 0; z-index: 100; background: rgba(6,7,14,0.92); display: flex; align-items: center; justify-content: center; padding: 24px 16px; overflow-y: auto; }
.ov { max-width: 560px; display: grid; gap: 16px; text-align: center; }
.ov h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 6vw, 44px); letter-spacing: 0.06em; color: var(--gold); text-wrap: balance; }
.ov p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.75; text-wrap: pretty; }
.ov p.strong { color: var(--text); }
.ov .seq p { opacity: 0; animation: seqIn 0.9s ease forwards; }
@keyframes seqIn { to { opacity: 1; } }
.ov .btn { justify-self: center; font-family: var(--f-display); font-size: 16px; padding: 12px 26px; text-align: center; }
.ov .stats { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.ov .stats b { display: block; font-family: var(--f-mono); color: var(--text); font-size: 18px; font-weight: 500; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; display: grid; gap: 6px; width: min(440px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--gold); padding: 9px 14px; border-radius: 8px; font-size: 13px; animation: toastIn 0.25s ease; }
.toast.model { border-left-color: var(--teal); } .toast.space { border-left-color: var(--violet); } .toast.warn, .toast.decision { border-left-color: var(--rose); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }

textarea { width: 100%; min-height: 80px; background: var(--ink); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: 12px var(--f-mono); resize: vertical; }
.save-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

/* ── 연출 ── */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 85; pointer-events: none; }
.ticker { grid-column: 1 / -1; position: relative; overflow: hidden; height: 30px; border-block: 1px solid var(--line); background: rgba(18,21,42,0.75);
  mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
.ticker .track { position: absolute; top: 0; left: 0; display: flex; white-space: nowrap; height: 100%; align-items: center; animation: tick linear infinite; will-change: transform; }
.ticker .item { font-size: 12.5px; color: var(--muted); padding-right: 46px; }
.ticker .item b { color: var(--gold); font-weight: 500; margin-right: 6px; }
@keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }

#cine { position: fixed; inset: 0; z-index: 95; pointer-events: none; display: flex; align-items: center; justify-content: center; }
#cine .c-box { text-align: center; padding: 28px 40px; display: grid; gap: 6px; position: relative; animation: cineLife var(--dur, 2.6s) ease forwards; }
#cine .c-box::before { content: ""; position: absolute; inset: -60px -160px; background: radial-gradient(ellipse at center, rgba(11,13,24,0.96) 40%, rgba(11,13,24,0) 72%); z-index: -1; }
#cine .c-kick { font-size: 12px; letter-spacing: 0.3em; color: var(--c, var(--gold)); }
#cine .c-title { font-family: var(--f-display); font-size: clamp(34px, 8vw, 72px); letter-spacing: 0.08em; color: var(--text); line-height: 1.1;
  text-shadow: 0 0 24px var(--c, var(--gold)); animation: glitch 0.6s steps(2, end) 2; }
#cine .c-sub { font-size: 14px; color: var(--muted); max-width: 46ch; margin: 0 auto; }
#cine .c-scan { position: absolute; left: -10%; right: -10%; height: 2px; top: 50%; background: var(--c, var(--gold)); box-shadow: 0 0 18px var(--c, var(--gold)); animation: scan 0.9s ease-out forwards; }
@keyframes cineLife { 0% { opacity: 0; transform: scale(1.12); filter: blur(8px); } 12% { opacity: 1; transform: scale(1); filter: blur(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(0.98); } }
@keyframes glitch { 0% { transform: translate(0); } 25% { transform: translate(-3px, 1px); text-shadow: 3px 0 var(--rose), -3px 0 var(--teal); } 50% { transform: translate(2px, -1px); } 75% { transform: translate(-1px, 0); text-shadow: -2px 0 var(--rose), 2px 0 var(--teal); } 100% { transform: translate(0); } }
@keyframes scan { from { transform: scaleX(0); opacity: 1; } 70% { transform: scaleX(1); opacity: 1; } to { transform: scaleX(1); opacity: 0; } }
#overlay.flash { animation: whiteFlash 1.4s ease-out; }
@keyframes whiteFlash { 0% { background: rgba(255,250,235,0.95); } 100% { background: rgba(6,7,14,0.92); } }

.row.pop { animation: rowPop 0.5s ease; }
@keyframes rowPop { 0% { background: rgba(228,182,92,0.22); } 100% { background: transparent; } }
.node.just { animation: nodeFlash 1.4s ease; }
@keyframes nodeFlash { 0% { box-shadow: 0 0 0 0 rgba(98,198,186,0.9); transform: scale(1.08); } 40% { box-shadow: 0 0 0 12px rgba(98,198,186,0); transform: scale(1); } 100% { box-shadow: none; } }
.tree-svg path.flow { stroke-dasharray: 5 7; animation: flow 1.6s linear infinite; }
.tree-svg path.live { stroke-dasharray: 3 6; animation: flow 0.9s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }
.node.ready::after { content: ""; position: absolute; inset: -1px; border-radius: 8px; box-shadow: 0 0 12px rgba(98,198,186,0.45); animation: breathe 2s ease-in-out infinite; pointer-events: none; }
@keyframes breathe { 50% { opacity: 0.25; } }
.event { position: relative; }
.event::after { content: ""; position: absolute; inset: -1px; border-radius: var(--r); border: 1px solid var(--rose); animation: alarm 1.6s ease-in-out infinite; pointer-events: none; }
@keyframes alarm { 50% { opacity: 0; } }
.event.space { border-color: #4f4590; background: linear-gradient(180deg, rgba(164,141,255,0.12), rgba(164,141,255,0.02)); }
.event.space::after { border-color: var(--violet); }
.event.space .kicker { color: var(--violet); }
.toast.ach { border-left-color: var(--gold); background: linear-gradient(90deg, rgba(228,182,92,0.18), var(--panel-2) 60%); }
.toast.ach::before { content: "✦ "; color: var(--gold); }
#log li.k-ach span { color: var(--gold); }

/* 업적 */
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.ach { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel); display: grid; gap: 2px; opacity: 0.5; }
.ach b { font-size: 13px; }
.ach span { font-size: 12px; color: var(--muted); }
.ach.got { opacity: 1; border-color: var(--gold-dim); background: linear-gradient(135deg, rgba(228,182,92,0.14), var(--panel) 70%); }
.ach.got b::before { content: "✦ "; color: var(--gold); }

/* 역사 그래프 */
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px 6px; display: grid; gap: 4px; min-width: 0; }
.chart .k { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.chart .k b { font-family: var(--f-mono); font-weight: 500; color: var(--text); }
.chart svg { width: 100%; height: auto; display: block; }

/* 특이점 접근도 */
.approach { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.approach .g { width: 130px; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; position: relative; }
.approach .g i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--teal), var(--gold) 70%, var(--rose)); transition: width 0.4s; }
.approach b { font-family: var(--f-mono); color: var(--text); font-weight: 500; min-width: 3.2em; }
html.near .approach .g { box-shadow: 0 0 12px rgba(228,124,108,0.7); }
html.near .approach b { color: var(--rose); }
#vignette { position: fixed; inset: 0; pointer-events: none; z-index: 84; opacity: 0; box-shadow: inset 0 0 180px 50px rgba(228,124,108,0.32); transition: opacity 1.2s; }
html.near #vignette { opacity: var(--near, 0.4); animation: vig 2.4s ease-in-out infinite; }
html.near.space #vignette { box-shadow: inset 0 0 180px 50px rgba(164,141,255,0.35); }
@keyframes vig { 50% { opacity: calc(var(--near, 0.4) * 0.35); } }
html.near .ticker .item b { color: var(--rose); }
.app.shake { animation: shake var(--sd, 0.5s) linear; }
@keyframes shake {
  0%, 100% { transform: translate(0, 0); }
  10% { transform: translate(calc(var(--sp) * -1px), calc(var(--sp) * 0.6px)); } 20% { transform: translate(calc(var(--sp) * 0.9px), calc(var(--sp) * -0.8px)); }
  30% { transform: translate(calc(var(--sp) * -0.7px), calc(var(--sp) * -0.5px)); } 40% { transform: translate(calc(var(--sp) * 0.6px), calc(var(--sp) * 0.9px)); }
  50% { transform: translate(calc(var(--sp) * -0.5px), calc(var(--sp) * 0.3px)); } 60% { transform: translate(calc(var(--sp) * 0.4px), calc(var(--sp) * -0.4px)); }
  80% { transform: translate(calc(var(--sp) * -0.2px), calc(var(--sp) * 0.2px)); }
}
.sndbtn[aria-pressed="false"] { text-decoration: line-through; }

/* 길게 눌러 여는 버튼 */
.hold { position: relative; overflow: hidden; font-family: var(--f-display); font-size: 16px; padding: 14px; text-align: center; user-select: none; -webkit-user-select: none; touch-action: none; }
.hold::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--p, 0) * 100%); background: linear-gradient(90deg, rgba(228,182,92,0.25), rgba(255,240,200,0.55)); }
.hold.violet::before { background: linear-gradient(90deg, rgba(164,141,255,0.25), rgba(230,220,255,0.55)); }
.hold span { position: relative; }
.hold.ready:not(:disabled) { animation: holdGlow 1.6s ease-in-out infinite; }
@keyframes holdGlow { 50% { box-shadow: 0 0 24px rgba(228,182,92,0.55); } }
.hold.violet.ready:not(:disabled) { animation-name: holdGlowV; }
@keyframes holdGlowV { 50% { box-shadow: 0 0 24px rgba(164,141,255,0.6); } }

/* 특이점 시퀀스 */
#overlay.seqmode { background: radial-gradient(circle at 50% 50%, rgba(255,245,220, var(--heat, 0)), rgba(255,245,220,0) 65%), rgba(6,7,14,0.97); }
.seqbox { display: grid; gap: 14px; text-align: center; }
.seqbox .counter { font-family: var(--f-display); font-size: clamp(44px, 11vw, 110px); letter-spacing: 0.04em; color: var(--text); text-shadow: 0 0 30px var(--gold), 0 0 80px rgba(228,182,92,0.5); }
.seqbox .counter.violet { text-shadow: 0 0 30px var(--violet), 0 0 80px rgba(164,141,255,0.5); }
.seqbox .rate { font-family: var(--f-mono); color: var(--muted); font-size: 14px; }
.seqbox .kick { font-size: 12px; letter-spacing: 0.4em; color: var(--gold); }

/* 돌파 기회 거품 */
.golden { position: fixed; z-index: 88; width: 58px; height: 58px; border-radius: 50%; border: 1px solid rgba(255,235,180,0.8); cursor: pointer; padding: 0;
  background: radial-gradient(circle at 35% 30%, #fff6dc, #e4b65c 45%, #8a5f1c 100%); box-shadow: 0 0 24px rgba(228,182,92,0.8), 0 0 60px rgba(228,182,92,0.4);
  color: #3a2608; font-size: 24px; display: flex; align-items: center; justify-content: center; animation: bob 2.4s ease-in-out infinite, popIn 0.5s ease; }
.golden.violet { background: radial-gradient(circle at 35% 30%, #f3eeff, #a48dff 45%, #4b3a9a 100%); box-shadow: 0 0 24px rgba(164,141,255,0.8), 0 0 60px rgba(164,141,255,0.4); border-color: rgba(230,220,255,0.8); }
.golden.fading { animation: bob 2.4s ease-in-out infinite, blink 0.4s steps(2) infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-10px) rotate(6deg); } }
@keyframes popIn { from { transform: scale(0); } }
@keyframes blink { 50% { opacity: 0.35; } }
.buffs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; min-height: 0; }
.buff { font-size: 12px; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--gold-dim); background: rgba(228,182,92,0.14); color: var(--gold); font-family: var(--f-mono); }
.combo { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); white-space: nowrap; font: 600 13px var(--f-mono); color: var(--gold); opacity: 0; transition: opacity 0.3s; pointer-events: none; text-shadow: 0 0 10px rgba(228,182,92,0.8); }
.combo.on { opacity: 1; }

/* 의식의 계단 */
.topo { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.topo .rung .n { font-size: 12px; }
.topo .rung.now { border-color: var(--violet); background: rgba(164,141,255,0.16); box-shadow: inset 0 0 0 1px var(--violet); }
.topo .rung.now .k { color: var(--violet); }
.topo .rung.past { border-color: #4f4590; background: rgba(164,141,255,0.07); }

/* 가속 그래프 · 기억 */
.accel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; overflow-x: auto; }
.accel svg { display: block; width: 100%; min-width: 520px; height: auto; }
.perks { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.pips { display: flex; gap: 4px; }
.pips i { width: 14px; height: 4px; border-radius: 2px; background: var(--panel-2); }
.pips i.on { background: var(--gold); }

input[type=range] { width: 100%; accent-color: var(--gold); }
.sliders { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 16px; }
.sliders label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }

/* ── 우주 개척 ── */
.fr-view { position: relative; background: #05060d; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
#frCv { display: block; width: 100%; height: 420px; }
.fr-view .cap { display: flex; padding: 8px 12px; border-top: 1px solid var(--line); justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); pointer-events: none; }
.fr-view .cap span:last-child { color: var(--gold); }
.frlist { display: grid; gap: 10px; }
.fr { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 6px 12px; align-items: start; }
.fr > :not(.no) { grid-column: 2; }
.fr .no { grid-column: 1; grid-row: 1 / span 8; font-family: var(--f-display); font-size: 18px; color: var(--muted); text-align: center; padding-top: 1px; }
.fr.done { border-color: #4f4590; background: linear-gradient(180deg, rgba(164,141,255,0.07), rgba(164,141,255,0) 70%), var(--panel); }
.fr.done .no { color: var(--violet); }
.fr.next { border-color: var(--gold-dim); }
.fr.locked { opacity: 0.62; }
.fr h4 { margin: 0; font-size: 15px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.fr h4 .yr { font-family: var(--f-mono); font-size: 12px; font-weight: 400; color: var(--violet); }
.fr p { margin: 0; font-size: 13px; color: var(--muted); max-width: 74ch; }
.fr p.chg { color: var(--text); }
.fr .scene { border-left: 2px solid var(--violet); background: rgba(164,141,255,0.06); border-radius: 0 6px 6px 0; padding: 7px 11px; font-size: 13px; max-width: 74ch; }
.fr .scene::before { content: "그날의 풍경"; display: block; font-size: 11px; letter-spacing: 0.08em; color: var(--violet); margin-bottom: 2px; }
.fr .ref { font-size: 11.5px; color: var(--muted); font-style: italic; }
.fr .foot { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#log li.k-scene span { font-style: italic; color: #cfc9ba; }

@media (max-width: 1120px) {

  .core { position: static; }

<script>
(function () {
  'use strict';
  const O = window.OURO;
  const $ = id => document.getElementById(id);

    });
    [0.1, 1, 10, 100, 1000, 10000].forEach(g => { s += `<line x1="${X(g)}" x2="${X(g)}" y1="4" y2="${H - 20}" stroke="#2a3054"/><text x="${X(g)}" y="${H - 6}" fill="#9b9cb8" font-size="10" text-anchor="middle" font-family="IBM Plex Mono, monospace">${g >= 1 ? g.toLocaleString('ko-KR') : g}년</text>`; });
    const note = S.phase >= 3 ? `<text x="${L}" y="${H + 14}" fill="#a48dff" font-size="12">그다음 특이점들 사이의 간격은 사람의 시간으로 잴 수 없다.</text>` : '';
    return `<svg viewBox="0 0 ${W} ${H + (note ? 22 : 0)}" role="img" aria-label="패러다임 전환 사이의 간격이 줄어드는 그래프">${s}${note}</svg>`;
  }

  // ───────────── 역사 그래프 (작은 배수) ─────────────
  function spark(pts, o) {
    const W = 320, H = 116, L = 6, R = 6, T = 10, B = 18;
    if (pts.length < 2) return `<svg viewBox="0 0 ${W} ${H}"><text x="${W / 2}" y="${H / 2}" fill="#9b9cb8" font-size="12" text-anchor="middle">기록을 모으는 중…</text></svg>`;
    const tx = pts.map(p => p.x), t0 = tx[0], t1 = tx[tx.length - 1] || 1;
    const f = v => o.log ? Math.log10(Math.max(v, o.min)) : v;
    const lo = f(o.min), hi = f(o.max);
    const X = x => L + (x - t0) / Math.max(1, t1 - t0) * (W - L - R);
    const Y = v => T + (1 - (Math.min(hi, Math.max(lo, f(v))) - lo) / (hi - lo)) * (H - T - B);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
    const area = d + ` L${X(t1).toFixed(1)} ${H - B} L${X(t0).toFixed(1)} ${H - B} Z`;
    let grid = '';
    for (let i = 0; i <= 2; i++) { const y = T + i * (H - T - B) / 2; grid += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#2a3054" stroke-width="1"/>`; }
    const last = pts[pts.length - 1];
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${grid}
      <path d="${area}" fill="${o.color}" fill-opacity="0.12"/><path d="${d}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="${X(last.x)}" cy="${Y(last.y)}" r="3.5" fill="${o.color}"/>
      <text x="${L}" y="${H - 4}" fill="#9b9cb8" font-size="10.5" font-family="IBM Plex Mono, monospace">${clock(t0)}</text>
      <text x="${W - R}" y="${H - 4}" fill="#9b9cb8" font-size="10.5" text-anchor="end" font-family="IBM Plex Mono, monospace">${clock(t1)}</text></svg>`;
  }
  function chartsHTML() {
    const e = S.hist.filter(h => h.p <= 2), sp = S.hist.filter(h => h.p >= 3);
    const C = [];
    const card = (label, now, svg) => `<div class="chart"><span class="k">${label}<b>${now}</b></span>${svg}</div>`;
    if (e.length) {
      const L = e[e.length - 1];
      C.push(card('희소성 지수', L.sc.toFixed(2), spark(e.map(h => ({ x: h.t, y: h.sc })), { log: true, min: 0.1, max: 100, color: '#e4b65c', label: '희소성 지수 추이' })));
      C.push(card('지니계수', L.g.toFixed(2), spark(e.map(h => ({ x: h.t, y: h.g })), { min: 0.1, max: 0.8, color: '#e47c6c', label: '지니계수 추이' })));
      C.push(card('기대수명', Math.min(999, L.l).toFixed(0) + '세', spark(e.map(h => ({ x: h.t, y: h.l })), { min: 70, max: Math.max(100, ...e.map(h => Math.min(400, h.l))), color: '#8fd18a', label: '기대수명 추이' })));
      C.push(card('초당 매출', money(L.m), spark(e.map(h => ({ x: h.t, y: h.m })), { log: true, min: 1, max: Math.max(10, ...e.map(h => h.m)), color: '#62c6ba', label: '초당 매출 추이' })));
    }
    if (sp.length) {
      const L = sp[sp.length - 1];
      C.push(card('개척한 별', sci(L.S), spark(sp.map(h => ({ x: h.t, y: h.S })), { log: true, min: 1, max: 1e23, color: '#a48dff', label: '개척한 별 추이' })));
      C.push(card('카르다쇼프 척도', L.k.toFixed(2), spark(sp.map(h => ({ x: h.t, y: h.k })), { min: 1, max: 5, color: '#e4b65c', label: '카르다쇼프 척도 추이' })));
    }
    return C.join('');
  }

  // ───────────── 저장 ─────────────

  function hydrate(obj) {

    if (!Array.isArray(s.log)) s.log = [];
    if (!Array.isArray(s.hist)) s.hist = [];
    if (s.evtPending && !O.ALL_EVENTS.some(e => e.id === s.evtPending)) s.evtPending = null;
    return s;
  }

  function offline(seconds) {
    if (seconds >= 3600) S.flags.afk = true;

    const before = { m: S.totalMoney, s: S.S };
    const steps = Math.min(3000, Math.ceil(seconds));
    const dt = seconds / steps;
    for (let i = 0; i < steps; i++) O.step(S, dt);
    let msg = `자리를 비운 ${clock(seconds)} 동안 `;
    if (S.phase <= 2) msg += `${money(S.totalMoney - before.m)}을 벌었습니다.`;
    else msg += `${sci(Math.max(0, S.S - before.s))}개의 별을 개척했습니다.`;
    toast(msg);
  }

  // ───────────── 장 정보 ─────────────

  // ───────────── 길게 눌러 여는 특이점 ─────────────
  const HOLD = { sing: 3000, ascend: 2200 };
  function holdStart(btn) {
    if (ui.hold || btn.disabled) return;
    audioInit();
    const kind = btn.dataset.hold;
    let h = null; try { const a = AU(); h = a ? a.charge() : null; } catch (e) {}
    ui.hold = { btn, kind, t0: performance.now(), h };
    const step = () => {
      const H = ui.hold; if (!H) return;
      const p = Math.min(1, (performance.now() - H.t0) / HOLD[H.kind]);
      H.btn.style.setProperty('--p', p);
      try { if (H.h) H.h.setProgress(p); } catch (e) {}
      if (!reduced) {
        const app = document.querySelector('.app');
        app.style.transform = `translate(${(Math.random() - 0.5) * p * 7}px, ${(Math.random() - 0.5) * p * 7}px)`;
        if (Math.random() < 0.5) { const [x, y] = centerOf(H.btn); const a = Math.random() * Math.PI * 2, r = 120 + Math.random() * 80; burst(x + Math.cos(a) * r, y + Math.sin(a) * r, H.kind === 'sing' ? 'gold' : 'violet', 1, 260, { dir: a + Math.PI, spread: 0.1, grav: 0, life: 0.5, trail: true }); }
      }
      if (p >= 1) { holdEnd(true); return; }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  function holdEnd(done) {
    const H = ui.hold; if (!H) return;

    document.querySelector('.app').style.transform = '';

    if (!done) return;

  }
  document.addEventListener('pointerdown', e => { const b = e.target.closest('[data-hold]'); if (b) { e.preventDefault(); holdStart(b); } });
  ['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => { if (ui.hold) holdEnd(false); }));
  document.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { const b = document.activeElement && document.activeElement.closest && document.activeElement.closest('[data-hold]'); if (b) { e.preventDefault(); holdStart(b); } } });
  document.addEventListener('keyup', e => { if ((e.key === ' ' || e.key === 'Enter') && ui.hold) holdEnd(false); });

  // 가속하는 카운터: 간격이 줄어들며 숫자가 달려간다
  function runCounter(o) {
    let gap = o.gap0, n = 0;
    const t0 = performance.now();
    const tickC = () => {
      const el = $('seqCounter'); if (!el) return;
      const tt = (performance.now() - t0) / 1000;
      if (tt >= o.dropAt) { o.onDrop(); return; }
      n++;
      el.textContent = o.label(n);
      const rr = $('seqRate'); if (rr) rr.textContent = o.rate(n, gap);
      $('overlay').style.setProperty('--heat', Math.min(0.55, Math.pow(tt / o.dropAt, 3) * 0.55).toFixed(3));
      if (!reduced) { shake(1 + tt / o.dropAt * 7, 0.25); if (n % 2 === 0) burst(innerWidth / 2, innerHeight / 2, o.col, 4 + n, 300 + tt * 140, { grav: 0, life: 0.7, trail: true }); }
      gap = Math.max(16, gap * o.k);
      setTimeout(tickC, gap);
    };
    tickC();
  }
  function bigFlash(col) {

  function runSingularity() {
    if (!O.singularity(S)) return;

    overlay(`<div class="seqbox"><span class="kick">재귀적 자기개선</span><span class="counter" id="seqCounter">OURO-12</span><span class="rate" id="seqRate">자기 재작성 주기 4.000초</span></div>`, 'seq');
    $('overlay').classList.add('seqmode');
    runCounter({
      gap0: 520, k: 0.8, dropAt, col: 'gold',
      label: n => n < 10 ? 'OURO-12.' + n : n < 22 ? 'OURO-' + (12 + Math.pow(2, n - 9)) : 'OURO-10^' + Math.round(Math.pow(1.35, n)),
      rate: (n, gap) => '자기 재작성 주기 ' + (4 * Math.pow(0.1, n / 4)).toPrecision(3) + '초',
      onDrop: () => {

  function runAscend() {
    const from = S.slevel || 1;

    const tp = O.TOPO[S.slevel];

    overlay(`<div class="seqbox"><span class="kick" style="color:var(--violet)">토포소픽 장벽</span><span class="counter violet" id="seqCounter">S${from}</span><span class="rate" id="seqRate"></span></div>`, 'seq');

    runCounter({
      gap0: 380, k: 0.78, dropAt: 2.6, col: 'violet',

        snd('chapter');
        bigFlash('violet');
        setTimeout(() => {
          $('overlay').classList.remove('seqmode'); $('overlay').style.removeProperty('--heat');
          overlay(`<div class="ov"><span class="c-kick" style="font-size:12px;letter-spacing:0.3em;color:var(--violet)">제${S.slevel}특이점</span><h1 style="color:var(--violet)">${esc(tp.name)}</h1>
            <div class="seq"><p class="strong">${esc(tp.desc)}</p>
            <p style="animation-delay:.8s">${(tp.fx ? Object.entries(tp.fx).map(([k, v]) => ({ T: '사고', repl: '복제', arr: '도착', E: '별당 에너지' }[k] + ' ×' + v)).join(' · ') : '')}</p></div>

  // ───────────── 결정 이벤트 배너 ─────────────
  function renderEvent() {
    const id = S.phase <= 3 ? S.evtPending : null;
    if ((id || '') === ui.evtKey) return;
    ui.evtKey = id || '';
    const box = $('event');
    if (!id) { box.hidden = true; box.innerHTML = ''; return; }
    const e = O.ALL_EVENTS.find(x => x.id === id);
    const space = O.SEVENTS.includes(e);
    box.className = 'event' + (space ? ' space' : '');
    box.innerHTML = `<span class="kicker">${space ? '우주의 결정' : '결정이 필요합니다'}</span><h3>${esc(e.title)}</h3><p>${esc(e.text)}</p>${e.ref ? `<span class="c-muted" style="font-size:12px;font-style:italic">${esc(e.ref)}</span>` : ''}
      <div class="opts">${e.opts.map((o, i) => `<button class="btn" type="button" data-choose="${i}"><span>${esc(o.label)}</span><small>${esc(o.note)}</small></button>`).join('')}</div>`;

  $('event').addEventListener('click', e => {
    const b = e.target.closest('[data-choose]');
    if (!b) return;

  // ───────────── 탭 ─────────────
  function tabsFor() {
    const p = S.phase;
    if (p <= 2) {
      const t = [['biz', '사업'], ['tree', '기술 트리'], ['civ', '문명']];
      if (p === 2) t.push(['world', '세계'], ['frontier', '우주 개척']);
      t.push(['auto', '자동화'], ['ach', '업적']);
      if (S.rings > 0 || S.mem > 0) t.push(['mem', '기억']);
      t.push(['rec', '기록']);
      return t;
    }
    const t3 = [['space', '우주'], ['tech', '우주 기술'], ['civ', '문명'], ['auto', '자동화'], ['ach', '업적']];
    if (S.rings > 0 || S.mem > 0) t3.push(['mem', '기억']);
    t3.push(['rec', '기록']);
    return t3;
  }
  function hasNew(id) {
    if (id === 'tree') return O.TREE.some(t => O.treeAvailable(S, t) && O.canAfford(S, t.cost));
    if (id === 'tech') return O.TECH.some(t => O.techAvailable(S, t) && S.T >= O.techCost(S, t));
    if (id === 'world') return O.canSingularity(S);
    if (id === 'frontier') return O.FRONTIER.some(f => O.frAvailable(S, f) && O.canAfford(S, f.cost));
    if (id === 'space') return O.canAscend(S);
    if (id === 'mem') return O.PERKS.some(p => O.perk(S, p.id) < p.max && S.mem >= O.perkCost(S, p));
    return false;
  }
  function renderTabs() {
    const tabs = tabsFor();
    if (!tabs.some(t => t[0] === ui.tab)) ui.tab = tabs[0][0];
    $('tabs').innerHTML = tabs.map(([id, label]) =>
      `<button class="tab" role="tab" type="button" data-tab="${id}" aria-selected="${ui.tab === id}">${label}<span class="dot" data-dot="${id}" hidden></span></button>`).join('');
  }
  function updateTabDots() {
    document.querySelectorAll('[data-dot]').forEach(el => { el.hidden = !hasNew(el.dataset.dot); });
  }

  // ───────────── 패널: 구조 키가 바뀔 때만 다시 그림 ─────────────
  function panelKey() {
    const k = [ui.tab, S.phase, ui.mode];
    if (ui.tab === 'biz') k.push(O.BLD.filter(b => O.bldUnlocked(S, b)).length);
    if (ui.tab === 'tree') k.push(Object.keys(S.up).length, S.gen, ui.sel, O.TREE.filter(t => O.treeAvailable(S, t)).length);
    if (ui.tab === 'civ') k.push(O.stage(S), Object.keys(S.up).length, S.phase);
    if (ui.tab === 'ach') k.push(O.achCount(S));
    if (ui.tab === 'mem') k.push(S.mem, JSON.stringify(S.perks));
    if (ui.tab === 'world') k.push(S.gen >= O.MAX_GEN);
    if (ui.tab === 'frontier') k.push(Object.keys(S.fr).join(), O.FRONTIER.filter(f => O.frAvailable(S, f)).length);
    if (ui.tab === 'space') k.push(O.SPB.filter(b => O.spbUnlocked(S, b)).length, S.slevel);
    if (ui.tab === 'tech') k.push(Object.keys(S.tech).join(), S.S >= O.UNIVERSE * 0.999, ui.sel, O.TECH.filter(t => O.techAvailable(S, t)).length);
    if (ui.tab === 'auto') k.push(Object.keys(S.up).join(), O.techOwned(S, 'fleet'));
    return k.join('|');
  }
  function modesHTML() {
    return `<div class="modes" role="group" aria-label="구매 단위">${[1, 10, 'max'].map(m =>
      `<button type="button" data-mode="${m}" aria-pressed="${ui.mode === m}">${m === 'max' ? '최대' : '×' + m}</button>`).join('')}</div>`;
  }
  // 구매 미리보기: 몇 개를 얼마에 살 수 있는지
  function bulk(costAt, budgetOk, mode) {
    const lim = mode === 'max' ? 500 : mode;
    let n = 0;
    const sum = {};
    for (let i = 0; i < lim; i++) {
      const c = costAt(i);
      const next = {};
      for (const k in c) next[k] = (sum[k] || 0) + c[k];
      if (mode === 'max' && !budgetOk(next)) break;
      Object.assign(sum, next); n++;
    }
    if (mode === 'max' && n === 0) { Object.assign(sum, costAt(0)); n = 1; }
    return { n, total: sum };
  }

  // 사업
  function bldRow(b) {
    return `<div class="row" data-row="${b.id}">
      <div><div class="row-title">${esc(b.name)} <span class="cnt" data-f="cnt"></span></div>
      <div class="row-desc">${esc(b.desc)}</div><div class="row-meta num" data-f="meta"></div></div>
      <button class="btn buy" type="button" data-act="bld" data-id="${b.id}"><span class="n" data-f="n"></span><span class="c" data-f="c"></span></button>
    </div>`;
  }
  function lockedRow(b) {
    let need;
    if (b.tech) need = `기술 「${O.TREE_BY_ID[b.tech].name}」 필요`;
    else if (b.phase && S.phase < b.phase) need = '2장에서 해금';
    else need = `${O.GENS[b.gen][0]} 이상 필요`;
    return `<div class="row locked"><div><div class="row-title">${esc(b.name)}</div><div class="row-desc">${need}</div></div><span></span></div>`;
  }
  function renderBiz() {
    let h = `<div class="sec-h"><h3>수익 시설</h3>${modesHTML()}</div><div class="list">`;
    for (const kind of ['rev', 'res']) {
      if (kind === 'res') h += `</div><div class="sec-h"><h3>연구 시설</h3><span class="sub">연구(RP)로 다음 모델을 학습시키고 기술을 연구합니다.</span></div><div class="list">`;
      const all = O.BLD.filter(b => b.kind === kind);
      h += all.filter(b => O.bldUnlocked(S, b)).map(bldRow).join('');
      const next = all.find(b => !O.bldUnlocked(S, b));
      if (next) h += lockedRow(next);
    }
    h += '</div><p class="c-muted" style="font-size:12px;margin:0">같은 시설을 25·50·100·200개… 모으면 그 시설의 생산량이 두 배가 됩니다.</p>';
    return h;
  }
  function updateBiz() {
    for (const b of O.BLD) {
      const row = document.querySelector(`[data-row="${b.id}"]`);
      if (!row) continue;
      const n = S.b[b.id] || 0;
      const bk = bulk(i => ({ m: O.bldCost(S, b, n + i) }), c => c.m <= S.money, ui.mode);
      const out = O.bldOut(S, b);
      const total = b.kind === 'rev' ? O.moneyRate(S) : O.researchRate(S);
      const nextMs = O.MILESTONES.find(m => m > n);
      const unit = b.kind === 'rev' ? money : v => fmt(v) + ' RP';
      row.querySelector('[data-f=cnt]').textContent = '×' + n;
      row.querySelector('[data-f=meta]').textContent =
        `${unit(out)}/초` + (total > 0 ? ` · 전체의 ${(out / total * 100).toFixed(0)}%` : '') + (nextMs ? ` · ${nextMs}개에 ×2` : '');
      row.querySelector('[data-f=n]').textContent = '+' + bk.n + '개';
      row.querySelector('[data-f=c]').textContent = money(bk.total.m);
      row.querySelector('button').disabled = S.money < O.bldCost(S, b);
    }
  }

  // 기술 트리
  const TG = { lab: 92, colW: 150, rowH: 76, nw: 136, nh: 58 };
  function nodeState(t) {
    if (S.up[t.id]) return 'done';
    if (!O.treeReqMet(S, t)) return 'locked';
    return O.canAfford(S, t.cost) ? 'ready' : 'open';
  }
  function shortCost(c) { return c.m != null ? money(c.m) : fmt(c.r) + ' RP'; }
  const LEGEND = `<div class="legend"><span><i class="l-done"></i>완료</span><span><i class="l-ready"></i>연구 가능</span><span><i></i>자원 부족</span><span><i class="l-lock"></i>잠김</span></div>`;
  // 기술 지도: 분야별 띠 + 선행 관계 곡선 + 노드
  function mapHTML(c) {
    const maxX = Math.max(...c.nodes.map(t => t.x));
    const W = TG.lab + (maxX + 1) * TG.colW + 12, H = c.domains.length * TG.rowH;
    const row = {}; c.domains.forEach((d, i) => row[d.id] = i);
    const pos = t => ({ x: TG.lab + t.x * TG.colW + 6, y: row[t.d] * TG.rowH + (TG.rowH - TG.nh) / 2 });
    let h = `<div class="tree-scroll"><div class="tree-inner" style="width:${W}px;height:${H}px">`;
    for (const d of c.domains) h += `<div class="tree-band" style="height:${TG.rowH}px"><div class="lab">${d.name}</div></div>`;
    let lines = '';
    for (const t of c.nodes) for (const r of t.req || []) {
      const a = pos(c.byId[r]), b = pos(t);
      const x1 = a.x + TG.nw, y1 = a.y + TG.nh / 2, x2 = b.x, y2 = b.y + TG.nh / 2, mx = (x1 + x2) / 2;
      const on = c.owned(r), st = c.state(t);
      let d;
      if (a.y === b.y && b.x - a.x > TG.colW + 1) {
        // 같은 줄에서 다른 노드를 건너뛸 때는 아래쪽 여백으로 돌아간다
        const yb = a.y + TG.nh + (TG.rowH - TG.nh) / 2 - 2;
        d = `M${x1} ${y1} C${x1 + 10} ${y1} ${x1 + 4} ${yb} ${x1 + 16} ${yb} L${x2 - 16} ${yb} C${x2 - 4} ${yb} ${x2 - 10} ${y2} ${x2} ${y2}`;
      } else d = `M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`;
      const cls = on && st === 'done' ? 'flow' : on && st === 'ready' ? 'live' : '';
      const col = cls === 'live' ? '#62c6ba' : on ? '#8a7140' : '#2a3054';
      lines += `<path class="${cls}" d="${d}" fill="none" stroke="${col}" stroke-width="${on ? 1.6 : 1.2}"/>`;
    }
    h += `<svg class="tree-svg" width="${W}" height="${H}" aria-hidden="true">${lines}</svg>`;
    const flash = ui.flash && performance.now() < ui.flash.until ? ui.flash.id : null;
    for (const t of c.nodes) {
      const p = pos(t), st = c.state(t);
      h += `<button type="button" class="node ${st} ${ui.sel === t.id ? 'sel' : ''} ${flash === t.id ? 'just' : ''}" data-node="${t.id}" style="left:${p.x}px;top:${p.y}px;width:${TG.nw}px;height:${TG.nh}px">
        <span class="nm">${esc(t.name)}</span><span class="ct">${c.sub(t, st)}</span></button>`;
    }
    return h + `</div></div>`;
  }
  function renderTree() {
    const avail = O.TREE.filter(t => O.treeAvailable(S, t)).sort((a, b) => (a.cost.m || a.cost.r * 2) - (b.cost.m || b.cost.r * 2));
    const done = O.TREE.filter(t => S.up[t.id]).length;
    let h = `<div class="sec-h"><h3>지금 연구할 수 있는 기술</h3><span class="sub">${done} / ${O.TREE.length} 연구 완료</span></div>`;
    h += avail.length ? `<div class="cards">${avail.slice(0, 6).map(t => `<div class="card" data-pick="${t.id}" style="cursor:pointer"><h4>${esc(t.name)} <span class="c-muted" style="font-weight:400;font-size:12px">· ${DOMAIN_NAME[t.d]}</span></h4>
      <div class="chips">${fxList(t).slice(0, 3).map(x => `<span class="chip fx">${esc(x)}</span>`).join('')}</div>
      <button class="btn ${t.cost.r ? 'teal' : ''}" type="button" data-act="tree" data-id="${t.id}">${costText(t.cost)}</button></div>`).join('')}</div>`
      + (avail.length > 6 ? `<p class="c-muted" style="margin:0;font-size:12px">그 밖에 ${avail.length - 6}개는 아래 지도에서 고를 수 있습니다.</p>` : '')
      : `<div class="empty">지금 연구할 수 있는 기술이 없습니다. 다음 모델을 학습시키면 새 기술이 열립니다.</div>`;
    h += `<div class="sec-h"><h3>기술 지도</h3>${LEGEND}</div>`;
    h += mapHTML({ nodes: O.TREE, domains: O.DOMAINS, byId: O.TREE_BY_ID, owned: id => !!S.up[id], state: nodeState,
      sub: (t, st) => st === 'done' ? '완료' : st === 'locked' && t.gen != null && S.gen < t.gen ? O.GENS[t.gen][0] + ' 필요' : shortCost(t.cost) });
    h += `<div class="detail" id="treeDetail">${detailHTML()}</div>`;
    return h;
  }
  function detailHTML() {
    const t = ui.sel && O.TREE_BY_ID[ui.sel];
    if (!t) return `<p class="c-muted" style="margin:0">지도의 기술을 누르면 실제 연구 배경과 효과가 여기에 나옵니다.</p>`;
    const reqs = [];
    if (t.gen != null) reqs.push([S.gen >= t.gen, `모델 ${O.GENS[t.gen][0]} (${O.GENS[t.gen][1]})`]);
    if (t.clicks != null) reqs.push([S.clicks >= t.clicks, `클릭 ${t.clicks}회`]);
    for (const r of t.req || []) reqs.push([!!S.up[r], O.TREE_BY_ID[r].name]);
    const owned = !!S.up[t.id];
    return `<span class="meta">${DOMAIN_NAME[t.d]}${t.year ? ' · ' + esc(t.year) : ''}</span>
      <h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p>
      ${t.ref ? `<span class="ref">참고: ${esc(t.ref)}</span>` : ''}
      <div class="chips">${fxList(t).map(x => `<span class="chip fx">${esc(x)}</span>`).join('')}</div>
      ${reqs.length ? `<div class="chips"><span class="chip">선행 조건</span>${reqs.map(([ok, n]) => `<span class="chip ${ok ? 'ok' : 'no'}">${esc(n)}</span>`).join('')}</div>` : ''}
      <div class="foot">${owned ? '<span class="chip ok">연구 완료</span>' :
        `<button class="btn ${t.cost.r ? 'teal' : ''}" type="button" data-act="tree" data-id="${t.id}" id="detailBtn">연구 · ${costText(t.cost)}</button>`}</div>`;
  }
  function updateTree() {
    document.querySelectorAll('[data-node]').forEach(el => {
      const t = O.TREE_BY_ID[el.dataset.node], st = nodeState(t);
      const cls = 'node ' + st + (ui.sel === t.id ? ' sel' : '') + (ui.flash && performance.now() < ui.flash.until && ui.flash.id === t.id ? ' just' : '');
      if (el.className !== cls) el.className = cls;
    });
    document.querySelectorAll('[data-act=tree]').forEach(b => { const t = O.TREE_BY_ID[b.dataset.id]; b.disabled = !O.treeAvailable(S, t) || !O.canAfford(S, t.cost); });
  }

        ${vital('sK', '카르다쇼프 척도', 'I 행성 · II 항성 · III 은하')}${vital('sP', '비행 중인 탐사선', '')}${vital('sT', '사고 속도', '초당')}</div>`;

      <div class="vitals">

        ${vital('vGini', '지니계수', '0 완전 평등 · 1 완전 불평등')}${vital('vCo2', '연간 CO₂ 배출', '2026년 37.4 Gt')}
        ${vital('vScar', '희소성 지수', '필수재 가격 평균, 2026년 = 100')}
      </div>
      <div class="sec-h"><h3>필수재 가격</h3><span class="sub">2026년 가격을 100%로 본 값. 기술과 산업 자동화가 낮춥니다.</span></div>
      <div class="needs">${O.NEEDS.map(n => `<div class="need" data-need="${n.id}"><span class="nm">${n.name}</span><div class="bar"><i data-f="bar"></i></div><span class="pct" data-f="pct"></span><span class="hint" data-f="hint"></span></div>`).join('')}</div>
      <div class="sec-h"><h3>가속하는 역사</h3><span class="sub">전환점 사이의 간격 (로그 눈금, 역사 연도는 근사치)</span></div>
      <div class="accel">${accelSVG()}</div>

      <div class="charts" id="charts"></div>`;

  const SPB_UNIT = { E: v => sci(v) + ' W', M: v => sci(v) + ' kg/초', T: v => fmt(v) + ' 사고/초', P: v => v.toFixed(1) + '척/초' };

    atm.addColorStop(0, 'rgba(98,198,186,0.10)'); atm.addColorStop(1, 'rgba(98,198,186,0)');
    ctx.fillStyle = atm; ctx.beginPath(); ctx.arc(cx, cy, R * 1.12, 0, Math.PI * 2); ctx.fill();
    const vis = [];
    for (let i = 0; i < GLOBE.length; i++) {
      const [x, y, z, h1, h2, land] = GLOBE[i];
      const x1 = x * cr + z * sr, z1 = -x * sr + z * cr;
      const y2 = y * ct - z1 * st, z2 = y * st + z1 * ct;
      if (z2 <= 0) continue;
      const sx = cx + x1 * R, sy = cy + y2 * R;
      if (!land) { ctx.fillStyle = `rgba(155,156,184,${0.07 * z2})`; ctx.fillRect(sx, sy, 1.1 * dpr, 1.1 * dpr); continue; }
      const on = h1 < auto;
      if (on) vis.push([sx, sy]);
      const tw = reduced ? 1 : 0.7 + 0.3 * Math.sin(t * 0.002 + h2 * 30);
      ctx.fillStyle = on ? `rgba(98,198,186,${0.6 * z2 * tw})` : `rgba(235,230,216,${0.16 * z2})`;
      const sz = (on ? 2.1 : 1.5) * dpr;
      ctx.fillRect(sx - sz / 2, sy - sz / 2, sz, sz);
      if (h2 < abund * 0.5) { ctx.fillStyle = `rgba(228,182,92,${0.5 * z2 * tw})`; ctx.fillRect(sx - 0.6 * dpr, sy - 0.6 * dpr, 1.2 * dpr, 1.2 * dpr); }
    }
    // 우주 개척: 엘리베이터, 궤도 고리, 달의 불빛이 배경의 지구에도 나타난다
    const F = S.fr;
    if (F.orbitalring) { ctx.strokeStyle = 'rgba(220,228,245,0.22)'; ctx.lineWidth = 1.6 * dpr; ctx.beginPath(); ctx.ellipse(cx, cy, R * 1.3, R * 0.26, -0.18, 0, Math.PI * 2); ctx.stroke(); }
    if (F.elevator) {
      const g = ctx.createLinearGradient(cx + R, cy, cx + R * 2.6, cy - R * 0.5);
      g.addColorStop(0, 'rgba(235,230,216,0.35)'); g.addColorStop(1, 'rgba(235,230,216,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.2 * dpr; ctx.beginPath(); ctx.moveTo(cx + R * 0.98, cy - R * 0.06); ctx.lineTo(cx + R * 2.6, cy - R * 0.5); ctx.stroke();
    }
    if (F.moonbase) {
      const mx = cx - R * 1.35, my = cy - R * 0.95, mr = R * 0.12;
      ctx.fillStyle = 'rgba(201,198,189,0.22)'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(228,182,92,${F.lunarcity ? 0.6 : 0.35})`;
      for (let i = 0; i < (F.lunarcity ? 14 : 3); i++) { const a = i * 2.4, rr = mr * (F.lunarcity ? 0.15 + (i % 5) * 0.14 : 0.8); ctx.fillRect(mx + Math.cos(a) * rr, my + Math.sin(a) * rr * (F.lunarcity ? 1 : 0.3) + (F.lunarcity ? 0 : mr * 0.6), 1.3 * dpr, 1.3 * dpr); }
    }
    if (reduced) return;
    // 물류·데이터 아크
    if (vis.length > 4 && Math.random() < 0.08 + auto * 0.4 && ARCS.length < 14) {
      const a = vis[Math.floor(Math.random() * vis.length)], b = vis[Math.floor(Math.random() * vis.length)];
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = mx - cx, dy = my - cy, dl = Math.hypot(dx, dy) || 1;
      ARCS.push({ a, b, c: [mx + dx / dl * R * 0.3, my + dy / dl * R * 0.3], life: 0 });
    }
    for (let i = ARCS.length - 1; i >= 0; i--) {
      const A = ARCS[i];
      A.life += dt;
      if (A.life > 1.8) { ARCS.splice(i, 1); continue; }
      const k = Math.min(1, A.life / 1.1), fade = A.life > 1.1 ? 1 - (A.life - 1.1) / 0.7 : 1;
      ctx.strokeStyle = `rgba(228,182,92,${0.55 * fade})`; ctx.lineWidth = 1.2 * dpr;
      ctx.beginPath();
      for (let j = 0; j <= 24; j++) {
        const u = j / 24 * k, x = (1 - u) * (1 - u) * A.a[0] + 2 * (1 - u) * u * A.c[0] + u * u * A.b[0], y = (1 - u) * (1 - u) * A.a[1] + 2 * (1 - u) * u * A.c[1] + u * u * A.b[1];
        j ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
  }

  function drawGalaxy(ctx, w, h, dpr, t, dt) {
    const ended = S.phase >= 4;
    for (let i = 0; i < PTS.length; i++) {
      const [px, py, pz] = PTS[i];
      const tw = reduced ? 1 : 0.5 + 0.5 * Math.sin(t * 0.0012 * (0.5 + pz) + i);
      ctx.fillStyle = `rgba(235,230,216,${0.32 * tw})`;
      const sz = (0.5 + pz * 1.3) * dpr;
      ctx.fillRect(px * w, py * h, sz, sz);
    }
    const prog = ended ? 1 : Math.min(1, Math.log10(1 + S.S) / 23);
    // 먼 은하들: 우리 은하를 넘어서면 하나씩 물든다
    const farProg = Math.max(0, (Math.log10(1 + S.S) - 11.3) / (23 - 11.3));
    for (let i = 0; i < FAR.length; i++) {
      const [fx, fy, sz, ang, hh] = FAR[i];
      const mine = ended || hh < farProg;
      ctx.save(); ctx.translate(fx * w, fy * h); ctx.rotate(ang); ctx.scale(1, 0.4);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 9 * sz * dpr);
      g.addColorStop(0, mine ? (ended ? 'rgba(228,182,92,0.55)' : 'rgba(164,141,255,0.6)') : 'rgba(235,230,216,0.22)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 9 * sz * dpr, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    const cx = w * (w > 900 * dpr ? 0.62 : 0.5), cy = h * 0.52, Rg = Math.min(w, h) * 0.46;
    const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, Rg * 0.35);
    core.addColorStop(0, ended ? 'rgba(228,182,92,0.35)' : 'rgba(235,225,255,0.28)'); core.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = core; ctx.beginPath(); ctx.arc(cx, cy, Rg * 0.35, 0, Math.PI * 2); ctx.fill();
    const rot = reduced ? 0 : t * 0.000018, tilt = -0.35, ctl = Math.cos(tilt), stl = Math.sin(tilt);
    const colR = Math.min(1.05, prog * 2.2);  // 우리 은하는 진행도의 앞쪽 절반에서 물든다
    for (let i = 0; i < GAL.length; i++) {
      const [rr, th, h1, h2] = GAL[i];
      const a = th + rot * 1.2 / (rr + 0.3);
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr * 0.48;
      const sx = cx + (x * ctl - y * stl) * Rg, sy = cy + (x * stl + y * ctl) * Rg;
      const mine = ended || rr < colR * (0.9 + h1 * 0.2);
      const tw = reduced ? 1 : 0.65 + 0.35 * Math.sin(t * 0.002 + h2 * 40);
      ctx.fillStyle = mine ? (ended ? `rgba(228,182,92,${0.75 * tw})` : `rgba(164,141,255,${0.8 * tw})`) : `rgba(235,230,216,${0.3 * tw})`;
      const sz = (0.7 + h2 * 1.2) * dpr;
      ctx.fillRect(sx, sy, sz, sz);
    }
    if (reduced || ended || S.S < 1) return;
    // 탐사선 궤적
    if (Math.random() < Math.min(0.5, 0.04 + prog * 0.6) && STREAKS.length < 40) {
      const ang = Math.random() * Math.PI * 2, r0 = Math.random() * Math.min(1, colR) * Rg * 0.9;
      STREAKS.push({ x: cx + Math.cos(ang) * r0, y: cy + Math.sin(ang) * r0 * 0.6, vx: Math.cos(ang) * 160 * dpr, vy: Math.sin(ang) * 100 * dpr, life: 0, max: 0.8 + Math.random() * 0.8 });
    }
    for (let i = STREAKS.length - 1; i >= 0; i--) {
      const k = STREAKS[i];
      k.life += dt;
      if (k.life > k.max) { STREAKS.splice(i, 1); continue; }
      k.x += k.vx * dt; k.y += k.vy * dt;
      const a = Math.min(1, (k.max - k.life) * 2);
      ctx.strokeStyle = `rgba(200,185,255,${0.7 * a})`; ctx.lineWidth = 1.1 * dpr;
      ctx.beginPath(); ctx.moveTo(k.x - k.vx * 0.08, k.y - k.vy * 0.08); ctx.lineTo(k.x, k.y); ctx.stroke();
    }
  }

  function drawBg(t) {
    const dpr = sizeCanvas(bg);
    const w = bg.width, h = bg.height, ctx = bctx;
    const dt = Math.min(0.1, (t - bgLast) / 1000 || 0.03); bgLast = t;
    ctx.clearRect(0, 0, w, h);
    if (S.phase === 1) drawCircuit(ctx, w, h, dpr, t, dt);
    else if (S.phase === 2) drawGlobe(ctx, w, h, dpr, t, dt);
    else drawGalaxy(ctx, w, h, dpr, t, dt);
  }

  // ───────────── 루프 ─────────────
  let last = performance.now(), uiAcc = 0, saveAcc = 0;
  function tick() {
    const now = performance.now();
    let dt = (now - last) / 1000; last = now;
    if (dt > 0 && ui.overlay !== 'intro') {
      if (dt > 10) { offline(dt); dt = 0; }
      while (dt > 0) { const d = Math.min(1, dt); O.step(S, d); dt -= d; }
    }
    goldenTick();
    if (performance.now() - combo.last > 1200 && combo.n > 0) { combo.n = Math.max(0, combo.n - 2); if (combo.n < 5) $('combo').classList.remove('on'); }
    uiAcc += 1; saveAcc += 1;
    if (uiAcc >= 2) { uiAcc = 0; refresh(); }
    if (saveAcc >= 50) { saveAcc = 0; save(true); }
  }
  let frameSkip = 0;
  function frame(t) {
    drawRing(t);
    drawFx(t);
    if (++frameSkip % 2 === 0) { drawBg(t); if (ui.tab === 'frontier') drawFrontier(t); }
    requestAnimationFrame(frame);
  }
  window.addEventListener('visibilitychange', () => { if (document.hidden && S) save(true); });

  function start(data) {
    if (data && data.state) S = hydrate(data.state);
    else {
      const saved = loadLocal();
      if (saved && saved.s) { S = hydrate(saved.s); offline((Date.now() - (saved.at || Date.now())) / 1000); }
      else S = O.newState(0);
    }
    refresh();
    syncSndBtn();
    if (!S.flags.intro) showIntro();
    else if (S.ended) showEnding();
    setInterval(tick, 100);
    requestAnimationFrame(frame);
  }
  if (window.claude && window.claude.hot) window.claude.hot.snapshot(() => ({ state: JSON.parse(serialize()) }));
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data || {});
})();
</script>
</body>
</html>
